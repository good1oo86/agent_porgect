name: Weekly Work Review

on:
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate weekly status report
        run: |
          END_DATE=$(date -u +"%Y-%m-%d")
          START_DATE=$(date -u -d "1 week ago" +"%Y-%m-%d")

          LOG=$(git log --since="${START_DATE}" --until="${END_DATE}" \
            --pretty=format:"  %h %s (%an)" 2>/dev/null)

          MODIFIED=$(git log --since="${START_DATE}" --pretty=format: --name-only 2>/dev/null | sort -u)
          COMMIT_COUNT=$(echo "$LOG" | grep -c "^  ")

          REPORT="Weekly Status Update\n\n"
          REPORT+="Period: ${START_DATE} ~ ${END_DATE}\n\n"
          REPORT+="Commits this week: ${COMMIT_COUNT}\n\n"

          if [ -n "$LOG" ]; then
            REPORT+="Work Completed:\n${LOG}\n\n"
          else
            REPORT+="Work Completed:\n- (No commits this week)\n\n"
          fi

          REPORT+="Files Changed:\n"
          if [ -n "$MODIFIED" ]; then
            REPORT+="$(echo "$MODIFIED" | head -20 | sed 's/^/  - /')\n\n"
          else
            REPORT+="- (none)\n\n"
          fi

          REPORT+="Next Steps:\n"
          REPORT+="  - Continue current work\n"
          REPORT+="  - Review open issues / PRs\n"
          REPORT+="  - Plan next week priorities\n"

          printf "$REPORT"

          cat > weekly-status.md << EOF
## Weekly Status Update

**Period:** ${START_DATE} ~ ${END_DATE}

**Commits this week:** ${COMMIT_COUNT}

### Work Completed
$(if [ -n "$LOG" ]; then echo "$LOG"; else echo "- (No commits this week)"; fi)

### Files Changed
$(if [ -n "$MODIFIED" ]; then echo "$MODIFIED" | head -20 | sed 's/^/  - /'; else echo "- (none)"; fi)

### Next Steps
- Continue current work
- Review open issues / PRs
- Plan next week priorities
EOF

      - name: Commit and push report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly-status.md
          git commit -m "📊 Weekly status: $(date +%Y-%m-%d)" --allow-empty || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
