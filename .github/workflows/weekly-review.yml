name: Weekly Work Review

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate weekly report
        run: |
          START=$(date -u -d "1 week ago" +"%Y-%m-%d")
          END=$(date -u +"%Y-%m-%d")
          LOG=$(git log --since="${START}" --until="${END}" --pretty=format:"- %h %s (%an)" 2>/dev/null)
          MODIFIED=$(git log --since="${START}" --pretty=format: --name-only 2>/dev/null | sort -u | head -20)
          COUNT=$(git log --since="${START}" --oneline 2>/dev/null | wc -l | tr -d " ")

          echo "## Weekly Status Update" > weekly-status.md
          echo "" >> weekly-status.md
          echo "**Period:** ${START} ~ ${END}" >> weekly-status.md
          echo "" >> weekly-status.md
          echo "**Commits:** ${COUNT}" >> weekly-status.md
          echo "" >> weekly-status.md
          echo "### Work Completed" >> weekly-status.md
          echo "" >> weekly-status.md
          if [ -n "${LOG}" ]; then
            echo "${LOG}" >> weekly-status.md
          else
            echo "- (No commits this week)" >> weekly-status.md
          fi
          echo "" >> weekly-status.md
          echo "### Files Changed" >> weekly-status.md
          echo "" >> weekly-status.md
          if [ -n "${MODIFIED}" ]; then
            echo "${MODIFIED}" | sed "s/^/- /" >> weekly-status.md
          else
            echo "- (none)" >> weekly-status.md
          fi
          echo "" >> weekly-status.md
          echo "### Next Steps" >> weekly-status.md
          echo "" >> weekly-status.md
          echo "- Continue current work" >> weekly-status.md
          echo "- Review open issues / PRs" >> weekly-status.md
          echo "- Plan next week priorities" >> weekly-status.md

          cat weekly-status.md

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add weekly-status.md
          git commit -m "📊 weekly report $(date +%%Y-%%m-%%d)" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
